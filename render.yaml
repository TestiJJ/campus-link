services:
  # 1. CampusLink FastAPI Backend API
  - type: web
    name: campuslink-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECURITY_KEY
        sync: false

  # 2. CampusLink Vite Frontend SPA
  - type: static-site
    name: campus-link
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campus-link-backend-vhxr.onrender.com
    routes:
      - type: redirect
        source: /ping
        destination: https://campus-link-backend-vhxr.onrender.com/ping
      - type: redirect
        source: /api/ping
        destination: https://campus-link-backend-vhxr.onrender.com/ping
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /ping
        name: Content-Type
        value: application/json
      - path: /api/ping
        name: Content-Type
        value: application/json
