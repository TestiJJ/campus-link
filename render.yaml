services:
  # 1. CampusLink FastAPI Backend API
  - type: web
    name: campuslink-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true

  # 2. CampusLink Vite Frontend SPA
  - type: static-site
    name: campus-link
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: campuslink-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
