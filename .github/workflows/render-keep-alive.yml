name: Render Keep Alive

on:
  schedule:
    # Run every 10 minutes (Render free web services sleep after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CampusLink Backend
        run: |
          URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            URL="https://campus-link-backend-vhxr.onrender.com"
          fi
          echo "Sending keep-alive pulse to $URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$URL/")
          echo "Response code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "✅ Server is awake and responsive (HTTP $STATUS)!"
          else
            echo "⚠️ Server returned status $STATUS (or is waking up from cold boot)."
          fi
