<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="clGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#clGradient)" />
  
  <!-- Subtle inner ring highlight -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  
  <!-- Modern CL Monogram -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- C Shape -->
    <path d="M 230 160 C 160 160 110 205 110 275 C 110 345 160 390 230 390 C 265 390 290 380 305 365 L 285 330 C 270 345 250 352 230 352 C 185 352 152 320 152 275 C 152 230 185 198 230 198 C 250 198 270 205 285 220 L 305 185 C 290 170 265 160 230 160 Z" />
    <!-- L Shape -->
    <path d="M 320 165 L 358 165 L 358 350 L 420 350 L 420 390 L 320 390 Z" />
  </g>
</svg>
